<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Aetherion corrected folding-wing capsule blueprint with pointed ends, mirrored front view and four-wing end projection"><title>Aetherion corrected folding-wing capsule blueprint with pointed ends, mirrored front view and four-wing end projection</title><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#64798f" stroke-opacity=".12"/></pattern></defs><rect width="1200" height="780" fill="#0d141b"/><rect width="1200" height="780" fill="url(#grid)"/><defs><path id="capsule-body" d="M0-185Q38-150 46-90L46 85Q38 145 0 185Q-38 145-46 85L-46-90Q-38-150 0-185Z"/><path id="folding-wing-front" d="M-56-75L-168-185Q-190-65-173 40Q-154 132-117 182L-53 76Q-89 0-56-75Z"/><path id="wing-end-projection" d="M-10-45L-23-145L0-200L23-145L10-45Z"/></defs><text x="45" y="45" font-family="Arial,sans-serif" font-size="22" fill="#cdd8e2">AETHERION / FOLDING-WING CAPSULE</text><text x="45" y="73" font-family="Arial,sans-serif" font-size="13" fill="#8799aa">PROJECT-SPECIFIC CONFIGURATION DRAWING</text><text x="62" y="126" font-family="Arial,sans-serif" font-size="16" fill="#cdd8e2">STOWED / FRONT VIEW</text><text x="422" y="126" font-family="Arial,sans-serif" font-size="16" fill="#cdd8e2">DEPLOYED / FRONT VIEW</text><text x="855" y="126" font-family="Arial,sans-serif" font-size="16" fill="#cdd8e2">DEPLOYED / END VIEW</text><g transform="translate(193 338)"><g fill="none" stroke="#c0d0df" stroke-width="2"><use href="#capsule-body" fill="#15212c"/><path d="M0-185V185" stroke-dasharray="5 7" opacity=".4"/><path d="M-35-120Q-80 0-35 115M35-120Q80 0 35 115"/><path d="M-44-90H44M-44 85H44"/></g></g><g transform="translate(577 338)"><g fill="none" stroke="#c0d0df" stroke-width="2"><use href="#capsule-body" fill="#15212c"/><use href="#folding-wing-front" fill="#20303e" fill-opacity=".45"/><use href="#folding-wing-front" transform="scale(-1 1)" fill="#20303e" fill-opacity=".45"/><path d="M-46-90L-140-139M-46 85L-120 135M46-90L140-139M46 85L120 135"/><path d="M-47-35H47M-47 35H47"/><path d="M0-205V205" stroke-dasharray="6 8" opacity=".4"/><path d="M-23-146L-30-25L-21 130M23-146L30-25L21 130" stroke-dasharray="6 7" opacity=".5"/></g></g><g transform="translate(987 338)"><g fill="none" stroke="#c0d0df" stroke-width="2"><circle r="46"/><circle r="33"/><path d="M-208 0H208M0-208V208" stroke-dasharray="6 8" opacity=".35"/></g><use href="#wing-end-projection" transform="rotate(0)" fill="#a4bacb" fill-opacity=".1" stroke="#c0d0df" stroke-width="1.8"/><use href="#wing-end-projection" transform="rotate(90)" fill="#a4bacb" fill-opacity=".1" stroke="#c0d0df" stroke-width="1.8"/><use href="#wing-end-projection" transform="rotate(180)" fill="#a4bacb" fill-opacity=".1" stroke="#c0d0df" stroke-width="1.8"/><use href="#wing-end-projection" transform="rotate(270)" fill="#a4bacb" fill-opacity=".1" stroke="#c0d0df" stroke-width="1.8"/></g><text x="67" y="578" font-family="Arial,sans-serif" font-size="15" fill="#cdd8e2">Pointed upper and lower ends</text><text x="67" y="604" font-family="Arial,sans-serif" font-size="13" fill="#8799aa">Wing surfaces follow the stowed envelope.</text><text x="413" y="578" font-family="Arial,sans-serif" font-size="15" fill="#cdd8e2">Mirrored folding wing panels</text><text x="413" y="604" font-family="Arial,sans-serif" font-size="13" fill="#8799aa">Two visible wings; concealed panels indicated.</text><text x="840" y="578" font-family="Arial,sans-serif" font-size="15" fill="#cdd8e2">4-wing symmetry / 90° spacing</text><text x="840" y="604" font-family="Arial,sans-serif" font-size="13" fill="#8799aa">Axial projection of wing spans.</text><g fill="none" stroke="#c0d0df" stroke-width="2"><path d="M50 650H1150" stroke="#344556"/></g><text x="50" y="683" font-family="Arial,sans-serif" font-size="17" fill="#cdd8e2">Folding panels extend alongside the capsule; wing outline is distinct from Inhaler blades.</text><text x="50" y="714" font-family="Arial,sans-serif" font-size="15" fill="#8799aa">Hinge and linkage locations are illustrative interfaces for further CAD definition.</text><text x="50" y="747" font-family="Arial,sans-serif" font-size="12" fill="#8799aa">CONCEPT CONFIGURATION · NOT TO SCALE · NO FLIGHT OR MANUFACTURING VALIDATION</text></svg>